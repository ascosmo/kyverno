apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-ns-quota
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    # Bloqueia criação de Namespaces pelo GRP-USER
    - name: block-namespace
      match:
        any:
          - resources:
              kinds:
                - Namespace
      preconditions:
        all:
          - key: "{{ request.userInfo.groups }}"
            operator: AnyIn
            value:
              - "GRP-USER"
      validate:
        message: "Acesso negado: O grupo GRP-USER não tem permissão para criar Namespaces."
        deny: {}

    # Bloqueia edição de ResourceQuota pelo GRP-USER
    - name: block-edit-quota
      match:
        any:
          - resources:
              kinds:
                - ResourceQuota
      preconditions:
        all:
          - key: "{{ request.userInfo.groups }}"
            operator: AnyIn
            value:
              - "GRP-USER"
          - key: "{{ request.operation }}"
            operator: Equals
            value: UPDATE
      validate:
        message: "Acesso negado: O grupo GRP-USER não tem permissão para alterar ResourceQuotas."
        deny: {}

    # Bloqueia edição do kyverno pelo GRP-USER
    - name: block-kyverno-resources
      match:
        any:
          - resources:
              kinds:
              - ClusterPolicy
          - resources:
              kinds:
              - Namespace
              name: kyverno
      preconditions:
        all:
          - key: "{{ request.userInfo.groups }}"
            operator: AnyIn
            value:
              - "GRP-USER"
      validate:
        message: "Acesso negado: O grupo GRP-USER não tem permissão para modificar recursos do Kyverno."
        deny: {}
